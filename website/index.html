<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f4f6" />
    <meta name="description" content="让云端 Agent 用上你的电脑。ReadyRig 将本机文件、开发环境、浏览器和桌面接给线上 Agent，也能将已开放的工具临时分享给可信任的人。" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:title" content="ReadyRig — 云端的 Agent，也能用你的电脑" />
    <meta property="og:description" content="连接云端 Agent 与本机文件、开发环境、浏览器和桌面，也能把已开放的工具临时分享给可信任的人。" />
    <meta property="og:image" content="/brand/social-icon.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="ReadyRig — 云端的 Agent，也能用你的电脑" />
    <meta name="twitter:description" content="让线上 Agent 使用本机资料与环境，在本机查看执行过程、控制访问权限。" />
    <meta name="twitter:image" content="/brand/social-icon.png" />
    <link rel="icon" type="image/png" href="/brand/favicon.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <title>ReadyRig — 云端的 Agent，也能用你的电脑</title>
    <script>
      try {
        const preference = localStorage.getItem('readyrig-site-theme') || localStorage.getItem('readrig-site-theme');
        const theme = preference === 'light' || preference === 'dark'
          ? preference : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#1a1a1e' : '#f4f4f6';
      } catch {
        document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>ReadyRig 将 AI Agent 连接到本机工具。请启用 JavaScript 查看交互式官网，或访问 https://github.com/jo32/readyrig 阅读文档与获取安装包。</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
