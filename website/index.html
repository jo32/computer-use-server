    <title>ReadyRig — 一个 Agent，管理多台电脑</title>
    <script>
      try {
        const preference = localStorage.getItem('readyrig-site-theme') || localStorage.getItem('readrig-site-theme');
        const theme = preference === 'light' || preference === 'dark'
          ? preference : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#1a1a1e' : '#f4f4f6';
      } catch {
        document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>ReadyRig 让一个 Agent 查询和管理同一账号下的多台电脑，使用各自开放的本机工具。请启用 JavaScript 查看交互式官网，或访问 https://github.com/jo32/readyrig 阅读文档与获取安装包。</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
