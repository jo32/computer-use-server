name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag (v0.5.0)'
        required: true
permissions:
  contents: write
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Validate and test
        env:
          VERSION: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          make test
          node --check internal/server/assets/app.js
          node --test scripts/test-i18n.cjs
      - name: Build release assets
        env:
          VERSION: ${{ github.event.inputs.tag || github.ref_name }}
          RELEASE_REPO: ${{ github.repository }}
        run: sh scripts/release.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$VERSION" "dist/releases/${VERSION#v}/"* --verify-tag --generate-notes --title "ReadyRig ${VERSION#v}"
